name: .NET Build and Test

# This section controls automatically triggering the workflow
on:
  push:
    branches: [ "main", "develop" ] # Triggers on commits to these branches
  pull_request:
    branches: [ "main" ]            # Triggers when a PR is opened against main

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest # The cloud virtual machine type to use

    steps:
    # Step 1: Point GitHub to your repository and download the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Install the .NET SDK on the runner
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    # Step 3: Restore NuGet dependencies
    - name: Restore Dependencies
      run: dotnet restore ./Service.slnx

    # Step 4: Compile the application without restoring again (saves time)
    - name: Build Project
      run: dotnet build ./Service.slnx --configuration Release --no-restore

    # Step 5: Execute unit tests and collect code coverage
    - name: Run Tests
      run: >
        dotnet test ./Service.slnx --configuration Release --no-restore --no-build
        --collect:"XPlat Code Coverage"
        --results-directory ./coverage

    # Step 6: Turn the raw Cobertura output into a human-readable report + summary
    - name: Generate Coverage Report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
      with:
        reports: ./coverage/**/coverage.cobertura.xml
        targetdir: ./coverage/report
        reporttypes: 'Html;MarkdownSummaryGithub'

    # Step 7: Show the coverage summary on the workflow run page
    - name: Publish Coverage Summary
      if: always()
      run: cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    # Step 8: Keep the full HTML coverage report as a downloadable artifact
    - name: Upload Coverage Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/report