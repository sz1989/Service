version: '3.8'

services:
  api:
    build:
      context: ./src/Service
      dockerfile: dockerfile
    container_name: service-api
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PW}
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - "personnet"
      
  db:
    image: postgres:latest
    container_name: postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PW}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personuser -d persondb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped    
    networks:
      - "personnet"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=secretpassword
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - "personnet"

volumes:
  db_data:

networks:
  personnet:
    driver: bridge